name: Publish

on:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --filter "!@keri-js/verifier"

      - name: Set publish variables
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - run: node --no-warnings scripts/set-version.ts "${{ steps.vars.outputs.version }}"

      - run: pnpm run build

      # pnpm pack resolves keri's `cesr: workspace:*` to the exact version being packed; npm
      # publishes the resulting tarballs because pnpm publish cannot attach provenance.
      - name: Pack packages
        run: |
          pnpm --filter cesr exec pnpm pack --pack-destination "$RUNNER_TEMP"
          pnpm --filter keri exec pnpm pack --pack-destination "$RUNNER_TEMP"

      # cesr must exist on the registry before keri, which depends on this exact version, is
      # published against it.
      - name: Publish cesr
        run: npm publish "$RUNNER_TEMP/cesr-${{ steps.vars.outputs.version }}.tgz" --provenance --tag "${{ steps.vars.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish keri
        run: npm publish "$RUNNER_TEMP/keri-${{ steps.vars.outputs.version }}.tgz" --provenance --tag "${{ steps.vars.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
