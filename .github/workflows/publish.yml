name: Publish

on:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci --workspace packages/cesr --workspace packages/keri --include-workspace-root

      - name: Set publish variables
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - run: node --no-warnings scripts/set-version.ts "${{ steps.vars.outputs.version }}"

      - run: npm run build

      # cesr must exist on the registry before keri, which depends on this exact version, is
      # published against it.
      - name: Publish cesr
        run: npm publish -w cesr --provenance --tag "${{ steps.vars.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish keri
        run: npm publish -w keri --provenance --tag "${{ steps.vars.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
