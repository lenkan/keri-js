name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace packages/cesr --workspace packages/keri --include-workspace-root

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Run vector test
        run: npm run test:vector

  consumer:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22, 24, 25]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace packages/cesr --workspace packages/keri --include-workspace-root

      - name: Run consumer tests
        run: npm run test:consumer

  consumer-deno:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace packages/cesr --workspace packages/keri --include-workspace-root

      - name: Build packages
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2"

      # Deno resolves workspace-symlinked packages without applying their exports map, so its type
      # checker cannot see the declarations here. Consumers installing the published tarballs are
      # unaffected. This job is about whether the built library runs under Deno.
      - name: Run consumer tests in deno
        run: deno test --allow-net --allow-read --no-check test_consumer

  verifier:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Type check verifier app
        run: npm run check -w apps/verifier

      - name: Build verifier app
        run: npm run build -w apps/verifier

  interop:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace packages/cesr --workspace packages/keri --include-workspace-root

      - name: Setup python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run interop tests
        run: npm run test:interop
