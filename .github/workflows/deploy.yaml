name: Deploy Verifier

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "deploy-verifier"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: deno-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2"

      # Full install: the verifier is an apps/* member, so the --filter "./packages/*" form skips it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      # No --base: the verifier server hands this out from the root of its own origin.
      - name: Build verifier app
        run: pnpm --filter @keri-js/verifier run build

      - name: Bundle verifier server
        run: pnpm --filter @keri-js/verifier-server run build

      - name: Assemble deploy artifact
        run: cp -r apps/verifier/dist apps/verifier-server/dist/static

      # Against the artifact that is about to ship, so a broken bundle fails here
      # rather than in production.
      - name: Smoke test artifact
        working-directory: apps/verifier-server/dist
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write --unstable-kv main.js &
          server=$!
          trap 'kill $server' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3002/oobi > /dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS http://localhost:3002/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3002/oobi | grep -q .
          curl -fsS -X POST http://localhost:3002/api/sessions | grep -q '"token"'

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --org lenkan --app keri --prod --non-interactive apps/verifier-server/dist
